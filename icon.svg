<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#2D3A4A"/>

  <!-- Shield body -->
  <path d="M64 22 L98 38 L98 68 Q98 92 64 108 Q30 92 30 68 L30 38 Z"
        fill="#3B4D62" stroke="#4A6078" stroke-width="1.5"/>

  <!-- Orange accent circle (top-left, matching brand) -->

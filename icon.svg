  <!-- Document lines inside shield -->
  <rect x="48" y="50" width="28" height="3.5" rx="1.5" fill="#8899AA"/>
  <rect x="48" y="58" width="22" height="3.5" rx="1.5" fill="#8899AA"/>
  <rect x="48" y="66" width="25" height="3.5" rx="1.5" fill="#8899AA"/>

  <!-- Checkmark circle (bottom-right) -->
  <circle cx="82" cy="82" r="18" fill="#2D3A4A" stroke="#4A6078" stroke-width="1.5"/>
  <circle cx="82" cy="82" r="14" fill="#E8613A"/>

  <!-- Checkmark -->
  <polyline points="74,82 80,88 91,76"
            fill="none" stroke="white" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
